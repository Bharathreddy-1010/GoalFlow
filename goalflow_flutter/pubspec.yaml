name: goalflow_flutter
description: GoalFlow — Personal daily companion for meaningful goals, habits, and progress (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  http: ^1.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  video_player: ^2.8.2
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
